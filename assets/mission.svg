<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330"
     viewBox="0 0 1200 330" role="img">

<defs>
  <linearGradient id="page" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#050711"/>
    <stop offset="0.55" stop-color="#070B18"/>
    <stop offset="1" stop-color="#0B1020"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0" stop-color="#F1F5F9"/>
    <stop offset="0.55" stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10182B"/>
    <stop offset="1" stop-color="#0C1322"/>
  </linearGradient>
  <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#38BDF8" stop-opacity="0.20"/>
    <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#38BDF8" opacity="0.16"/>
  </pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="26" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <g>
    <path d="M18.5,0.5 L1181.5,0.5 L1199.5,18.5 L1199.5,311.5 L1181.5,329.5 L18.5,329.5 L0.5,311.5 L0.5,18.5 Z" fill="url(#page)"/>
    <path d="M18.5,0.5 L1181.5,0.5 L1199.5,18.5 L1199.5,311.5 L1181.5,329.5 L18.5,329.5 L0.5,311.5 L0.5,18.5 Z" fill="url(#dots)" opacity="0.5"/>
    <path d="M18.5,0.5 L1181.5,0.5 L1199.5,18.5 L1199.5,311.5 L1181.5,329.5 L18.5,329.5 L0.5,311.5 L0.5,18.5 Z" fill="url(#vig)"/>
    <path d="M18.5,0.5 L1181.5,0.5 L1199.5,18.5 L1199.5,311.5 L1181.5,329.5 L18.5,329.5 L0.5,311.5 L0.5,18.5 Z" fill="none"
          stroke="#243049" stroke-width="1"/>
    <rect x="0" y="0.5" width="1200" height="1.4" fill="url(#rule)" opacity="0.55"/>
    <rect x="0" y="0.5" width="96" height="1.4" fill="#8B5CF6" opacity="0.9"/>
    <rect x="0" y="0" width="1200" height="2" fill="#67E8F9" opacity="0.10"><animate attributeName="y" from="-4" to="330" dur="11s" repeatCount="indefinite"/></rect>
  </g>
  <text x="56" y="46" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#8B5CF6" letter-spacing="5" text-anchor="start" opacity="1.0" >CURRENT OBJECTIVE</text><rect x="656" y="40" width="80" height="1" fill="#243049"/><ellipse cx="600" cy="150" rx="420" ry="120" fill="url(#aura)" opacity="0.5"/><text x="600" y="138" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif" font-size="34" font-weight="600" fill="#F1F5F9" letter-spacing="1" text-anchor="middle" opacity="1.0" >“Transform ideas into working software.”</text><rect x="440" y="158" width="320" height="1" fill="url(#rule)" opacity="0.8"/><rect x="56" y="192" width="344" height="98" rx="6" fill="url(#card)" stroke="#243049" stroke-width="1"/><text x="78" y="224" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8B5CF6" letter-spacing="3" text-anchor="start" opacity="1.0" >01</text><text x="78" y="250" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="600" fill="#F1F5F9" letter-spacing="2" text-anchor="start" opacity="1.0" >SHARPEN AI &amp; PYTHON</text><text x="78" y="272" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" letter-spacing="0.6" text-anchor="start" opacity="1.0" >Go deeper on models, vision and agents.</text><rect x="426" y="192" width="344" height="98" rx="6" fill="url(#card)" stroke="#243049" stroke-width="1"/><text x="448" y="224" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8B5CF6" letter-spacing="3" text-anchor="start" opacity="1.0" >02</text><text x="448" y="250" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="600" fill="#F1F5F9" letter-spacing="2" text-anchor="start" opacity="1.0" >SHIP PRACTICAL SOFTWARE</text><text x="448" y="272" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" letter-spacing="0.6" text-anchor="start" opacity="1.0" >Finished beats impressive on paper.</text><rect x="796" y="192" width="344" height="98" rx="6" fill="url(#card)" stroke="#243049" stroke-width="1"/><text x="818" y="224" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8B5CF6" letter-spacing="3" text-anchor="start" opacity="1.0" >03</text><text x="818" y="250" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="600" fill="#F1F5F9" letter-spacing="2" text-anchor="start" opacity="1.0" >LEARN IN PUBLIC</text><text x="818" y="272" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" letter-spacing="0.6" text-anchor="start" opacity="1.0" >Repos, tests and write-ups, not promises.</text>
</svg>
