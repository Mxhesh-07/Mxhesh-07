<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300"
     viewBox="0 0 1200 300" role="img">

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04060e"/>
    <stop offset="0.55" stop-color="#0a1124"/>
    <stop offset="1" stop-color="#050a17"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc3ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc3ff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 H0 V40" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.55"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#9fd0ff" opacity="0.10"/>
  </pattern>
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
    <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
</defs>

  <g>
    <path d="M27,1 L1173,1 L1199,27 L1199,273 L1173,299 L27,299 L1,273 L1,27 Z" fill="url(#bg)" stroke="#1d3557" stroke-width="1.5"/>
    <path d="M27,1 L1173,1 L1199,27 L1199,273 L1173,299 L27,299 L1,273 L1,27 Z" fill="url(#grid)" opacity="0.5"/>
    <path d="M27,1 L1173,1 L1199,27 L1199,273 L1173,299 L27,299 L1,273 L1,27 Z" fill="url(#vig)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#scan)" opacity="0.30">
      <animate attributeName="y" from="-300" to="300" dur="7s" repeatCount="indefinite"/>
    </rect>
    <path d="M27,1 L1,1 L1,27" stroke="#4fc3ff" stroke-width="2.5" fill="none" opacity="0.9"/><path d="M1173,1 L1199,1 L1199,27" stroke="#4fc3ff" stroke-width="2.5" fill="none" opacity="0.9"/><path d="M27,299 L1,299 L1,273" stroke="#4fc3ff" stroke-width="2.5" fill="none" opacity="0.9"/><path d="M1173,299 L1199,299 L1199,273" stroke="#4fc3ff" stroke-width="2.5" fill="none" opacity="0.9"/>
    
  </g>
  <ellipse cx="600.0" cy="186" rx="330" ry="96" fill="url(#bloom)" data-deco="1"/><text x="600.0" y="106" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic',sans-serif" font-size="42" fill="#a78bfa" opacity="0.34" text-anchor="middle" letter-spacing="16" data-deco="1">일어나라</text><g filter="url(#glow)" opacity="0.9"><text x="600.0" y="198" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="46" font-weight="700" fill="#e6f0ff" letter-spacing="18" text-anchor="middle" opacity="1.0" >ARISE</text></g><rect x="390.0" y="220" width="420" height="1.5" fill="url(#edge)"/><text x="600.0" y="254" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#4a648c" letter-spacing="5" text-anchor="middle" opacity="1.0" >THE SYSTEM AWAITS YOUR NEXT DUNGEON</text>
</svg>
